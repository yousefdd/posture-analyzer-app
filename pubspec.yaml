name: foot_analyzer
description: "FootAnalyzer: تحليل الوقفة الرياضية والسكوات والبوش أب بالكاميرا."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  google_mlkit_pose_detection: ^0.14.0
  shared_preferences: ^2.5.3
  audioplayers: ^6.4.0
  share_plus: 10.1.4
  image_picker: ^1.1.2
  video_thumbnail: ^0.5.6
  gal: 2.3.0
  path_provider: ^2.1.5
  video_player: ^2.9.5
  wakelock_plus: 1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/brand/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
